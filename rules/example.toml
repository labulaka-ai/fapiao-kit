# 单位规则文件示例（数据均为虚构）。复制一份，改成你单位的抬头和税号。
# 用法：fapiao check 发票目录 --rules rules/example.toml

buyer_name = "示例大学"                 # 发票抬头（购买方名称），全角/半角括号、空格差异会自动忽略
buyer_tax_id = "99TEST000000000001"    # 购买方税号（统一社会信用代码）

# 可选：只接受这个日期范围内开的票
# date_from = "2026-01-01"
# date_to = "2026-12-31"

# 可选：按类别设置单张价税合计上限（元），类别取明细第一行 *星号* 之间的文字
[category_limits]
"餐饮服务" = 500
